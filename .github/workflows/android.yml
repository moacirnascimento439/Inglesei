name: App Android (APK)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test

  apk:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Lista de frases para as vozes naturais
        run: node tools/export-texts.mjs
      - name: Cache das vozes naturais
        uses: actions/cache@v4
        with:
          path: |
            .voices-cache
            www/audio
          key: vozes-${{ hashFiles('tools/voice-texts.json', 'tools/make-voices.py') }}
          restore-keys: vozes-
      - name: Gerar vozes naturais (Piper)
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          pip install piper-tts==1.8.0
          python tools/make-voices.py
      - run: npm run build
      - run: npx cap sync android
      - name: Montar o APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Inglesei.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Inglesei-apk
          path: Inglesei.apk
      - name: Publicar para download (Releases)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" Inglesei.apk \
            --title "Inglesei $TAG" \
            --notes "Baixe o arquivo **Inglesei.apk** no celular Android e toque nele para instalar. Versões novas instalam por cima e mantêm seu progresso." \
            --latest
